<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Game Gaple Online</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <div id="login-modal">
    <div class="login-box">
      <h3>Masuk Game Gaple</h3>
      <input type="text" id="username-input" placeholder="Masukkan nama..." />
      
      <div id="mode-selection" style="margin: 10px 0; text-align: left;">
        <label style="font-size: 12px; font-weight: bold; color: #cbd5e1; display: block; margin-bottom: 6px;">Pilih Mode Permainan:</label>
        <div style="display: flex; gap: 8px;">
          <button type="button" class="btn-mode active" data-mode="single">Tunggal (Single)</button>
          <button type="button" class="btn-mode" data-mode="team">Ganda (Team)</button>
        </div>
      </div>

      <button id="btn-join">Masuk Meja</button>
    </div>
  </div>

  <div id="game-container">
    <header>
      <div id="status">Selamat Bertanding Tournamen Gaple Orado Online</div>
    </header>

    <main id="board-area">
      <div id="game-over-modal" class="game-over-overlay">
        <div class="game-over-content">
          <div class="trophy-icon">🏆</div>
          <h2 id="go-winner-title">PERMAINAN SELESAI!</h2>
          <p id="go-winner-name">Pemenang: -</p>
          <div id="go-reason">Alasan...</div>
          <button id="btn-close-go">Tutup</button>
        </div>
      </div>

      <img src="logo.jpg" id="table-logo" alt="Logo Orado Domino" onerror="this.style.display='none'" />

      <!-- Player Top -->
      <div id="player-top" class="player-slot">
        <span class="p-name">Kosong</span>
        <span class="p-cards">Kartu: -</span>
        <div class="profile-reaction-menu" style="display: none;">
          <button class="btn-profile-emoji" data-sound="bayi_ketawa.mp3">😂</button>
          <button class="btn-profile-emoji" data-sound="nangis.mp3">😭</button>
          <button class="btn-profile-emoji" data-sound="wikwik.mp3">🔥</button>
        </div>
      </div>

      <!-- Player Left -->
      <div id="player-left" class="player-slot">
        <span class="p-name">Kosong</span>
        <span class="p-cards">Kartu: -</span>
        <div class="profile-reaction-menu" style="display: none;">
          <button class="btn-profile-emoji" data-sound="bayi_ketawa.mp3">😂</button>
          <button class="btn-profile-emoji" data-sound="nangis.mp3">😭</button>
          <button class="btn-profile-emoji" data-sound="wikwik.mp3">🔥</button>
        </div>
      </div>

      <!-- Player Right -->
      <div id="player-right" class="player-slot">
        <span class="p-name">Kosong</span>
        <span class="p-cards">Kartu: -</span>
        <div class="profile-reaction-menu" style="display: none;">
          <button class="btn-profile-emoji" data-sound="bayi_ketawa.mp3">😂</button>
          <button class="btn-profile-emoji" data-sound="nangis.mp3">😭</button>
          <button class="btn-profile-emoji" data-sound="wikwik.mp3">🔥</button>
        </div>
      </div>

      <div id="board"></div>

      <div id="chat-box">
        <div id="chat-messages"></div>
        
        <!-- Emoji bar dibersihkan dari fungsi suara langsung, chat tetap murni teks -->
        <div id="emoji-bar">
          <button class="btn-emoji">😀</button>
          <button class="btn-emoji">😂</button>
          <button class="btn-emoji">🔥</button>
          <button class="btn-emoji">👍</button>
          <button class="btn-emoji">😎</button>
          <button class="btn-emoji">🎉</button>
          <button class="btn-emoji">🙏</button>
        </div>

        <div class="chat-controls">
          <input type="text" id="chat-input" placeholder="Ketik pesan..." />
          <button id="btn-send-chat">Kirim</button>
        </div>
      </div>

      <button id="btn-toggle-chat">💬 Chat</button>
    </main>

    <footer>
      <div id="controls">
        <button id="btn-start-game">MULAI GAME</button>
        <button id="btn-pass" disabled>LEWAT / PASS</button>
      </div>

      <div id="my-hand-container">
        <div id="my-hand"></div>
      </div>
    </footer>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="main.js"></script>
</body>
</html>
